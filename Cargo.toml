[package]
name = "drift-ffi-sys"
version = "2.161.0"
edition = "2021"
description = "FFI bindings to drift program"

[lib]
crate-type = ["cdylib"]

[dependencies]
abi_stable = { version = "0.11", default-features = false }
anchor-lang = "0.29.0"
drift-program = { package = "drift", git = "https://github.com/drift-labs/protocol-v2.git", tag = "v2.161.0", features = [
    "mainnet-beta", "drift-rs"
] }
fxhash = "0.2.1"
serde_json = "=1.0.143"
